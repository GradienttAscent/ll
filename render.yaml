services:
  - type: web
    name: lazylift-backend
    runtime: node
    repo: https://github.com/GradienttAscent/ll
    branch: main
    autoDeploy: true
    plan: starter
    disk:
      name: lazylift-data
      mountPath: /var/data
      sizeGB: 1
    # LibreOffice produces faithful PPTX-to-PDF output; Poppler renders PDF pages to PNG.
    buildCommand: apt-get update && apt-get install -y --no-install-recommends libreoffice-impress poppler-utils && rm -rf /var/lib/apt/lists/* && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LAZYLIFT_DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: LAZYLIFT_CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
