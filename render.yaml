services:
  - type: web
    name: lazylift-backend
    runtime: docker
    repo: https://github.com/GradienttAscent/ll
    branch: main
    autoDeploy: true
    # LibreOffice conversion needs more headroom than the 512 MB starter tier.
    plan: 1c-2g
    disk:
      name: lazylift-data
      mountPath: /var/data
      sizeGB: 1
    # Dockerfile installs LibreOffice Impress and Poppler in the runtime image.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LAZYLIFT_DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: LAZYLIFT_CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
