services:
  - type: web
    name: lazylift-backend
    runtime: docker
    repo: https://github.com/GradienttAscent/ll
    branch: main
    autoDeploy: true
    plan: free

    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: LAZYLIFT_DATA_DIR
        value: /tmp/lazylift

      - key: GEMINI_API_KEY
        sync: false

      - key: LAZYLIFT_CORS_ORIGINS
        sync: false

      - key: APP_URL
        sync: false